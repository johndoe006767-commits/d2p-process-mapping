<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#331c41"><title>Finance towers | AstraZeneca</title><link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="style.css?v=20261016-fit"><link rel="stylesheet" href="tower-components.css?v=20261019-polish"><link rel="stylesheet" href="site-polish.css?v=20261027-kpi-label-wrap"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script><link rel="stylesheet" href="real-experience.css?v=20261027-legend-spacing"><link rel="stylesheet" href="tower-dashboard.css"><link rel="stylesheet" href="neural-lab.css?v=astral-6"><link rel="stylesheet" href="final-polish.css"><script src="neural/renderers.js?v=astral-3" defer></script><script src="neural/flow-data.js" defer></script><script src="neural/flow.js?v=astral-3" defer></script><link rel="stylesheet" href="viewport-refinements.css?v=4"><link rel="stylesheet" href="helpdesk.css?v=2"></head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="i-ne" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></symbol><symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></symbol><symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.6-6.4L3 8M3 3v5h5"/></symbol><symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 7h15M16 3l4 4-4 4M20 17H5M8 13l-4 4 4 4"/></symbol><symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1.5-1.5"/></symbol><symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></symbol><symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3 2 20h20zM12 9v5M12 17.5v.1"/></symbol></svg>
<section id="section-1" aria-label="Finance anatomy"><header><img src="./assets/astrazeneca.svg" alt="AstraZeneca" width="120" height="30"></header>
<main id="experience" aria-label="Interactive finance anatomy"><canvas id="scene" aria-label="Skeleton, heart and eight finance organs"></canvas><div id="labels"></div>
<div id="loading" role="status"><div class="load-body"></div><p id="load-message">Assembling your anatomy…</p><button id="retry" hidden>Try again</button></div>
<section id="detail" hidden><div id="process-neurons" aria-label="Source process stage shortcuts"></div><p id="process-status" class="process-status" role="status" aria-live="polite"></p><button id="back"><span class="control-symbol" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#i-left"/></svg></span><span>Back to overview</span></button><div class="detail-title"><p id="organ-name"></p><span class="demo-data">As-Is processes</span><h2 id="tower-name"></h2></div><div class="rotate-tools"><button id="reset"><span class="control-symbol reset-symbol" aria-hidden="true"><svg class="ico" aria-hidden="true"><use href="#i-reset"/></svg></span><span>Reset view</span></button></div>
      <div id="tower-telemetry-hud" class="telemetry-hud" aria-label="Tower automation health and activity mix">
        <div class="hud-header">
          <div class="hud-title-wrap">
            <h3 class="hud-tower-name" id="hud-tower-title">Finance tower</h3>
            <p class="hud-subtitle" id="hud-tower-subtitle">As-Is process data</p>
          </div>
          <button id="hud-handoff-btn" class="hud-action-btn hud-modal-trigger" data-view="handoffs" type="button" title="View tower handoffs">
            <svg class="ico" aria-hidden="true"><use href="#i-swap"/></svg><span>Handoffs</span>
          </button>
        </div>
        <div class="map-actions"><button id="high-level-button" type="button"><span class="flow-button-label">High-level flow</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M7 7h10v10"/></svg></button><button id="detailed-map-button" type="button"><span class="flow-button-label">Detailed flow</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-6-6 6 6 6-6"/></svg></button></div><label class="mobile-stage-picker">Jump to a stage<select id="mobile-stage-select"><option value="">Choose a stage…</option></select></label><div class="hud-health-row"><span>Automation health</span><span class="hud-score"><strong id="hud-score-pct">—</strong><span> / 100</span></span></div>
        <div class="hud-ecg-container" aria-hidden="true">

        </div>
        <div class="hud-mix-heading"><strong>Activity mix</strong><span><span id="hud-total">—</span> activities</span></div>
        <div class="hud-bar-container" aria-hidden="true">
          <div class="hud-bar-segment seg-automated hud-modal-trigger" data-view="auto" id="hud-bar-auto" style="width:0%"></div>
          <div class="hud-bar-segment seg-semi hud-modal-trigger" data-view="semi" id="hud-bar-semi" style="width:0%"></div>
          <div class="hud-bar-segment seg-manual hud-modal-trigger" data-view="manual" id="hud-bar-manual" style="width:0%"></div>
        </div>
        <div class="hud-legend">
          <button class="hud-legend-item hud-modal-trigger" type="button" data-view="auto"><strong id="hud-count-auto">—</strong><span><i class="legend-dot dot-auto"></i>Automated</span></button>
          <button class="hud-legend-item hud-modal-trigger" type="button" data-view="semi"><strong id="hud-count-semi">—</strong><span><i class="legend-dot dot-semi"></i>Semi-automated</span></button>
          <button class="hud-legend-item hud-modal-trigger" type="button" data-view="manual"><strong id="hud-count-manual">—</strong><span><i class="legend-dot dot-manual"></i>Manual</span></button>
        </div>
        <div class="hud-chips">
          <button class="hud-chip hud-modal-trigger" type="button" data-view="tpis"><span class="chip-lbl">TPIs</span><strong class="chip-val" id="hud-count-tpi">8</strong><svg class="ico ico-ne" aria-hidden="true"><use href="#i-ne"/></svg></button>
          <button class="hud-chip hud-modal-trigger" type="button" data-view="ai"><span class="chip-lbl">AI opportunities</span><strong class="chip-val" id="hud-count-ai">15</strong><svg class="ico ico-ne" aria-hidden="true"><use href="#i-ne"/></svg></button>
          <button class="hud-chip hud-modal-trigger" type="button" data-view="pain"><span class="chip-lbl">Pain points</span><strong class="chip-val" id="hud-count-pain">15</strong><svg class="ico ico-ne" aria-hidden="true"><use href="#i-ne"/></svg></button>
        </div>
      </div>
</section>
</main>
<div class="assembly-control"><input id="assembly" type="range" min="0" max="1000" value="0" aria-label="Assemble or disassemble organs"></div>
</section>

<section id="process-workspace" hidden aria-label="Tower Process Workspace"></section><script type="module" src="scene.js?v=helpdesk-2"></script>

<section id="tower-workbench" hidden role="dialog" aria-modal="true" aria-labelledby="tw-tower-title"></section>

</body></html>
