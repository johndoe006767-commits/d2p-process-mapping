\",\"tower\":\"FPAO\",\"fid\":\"FPAO-04\",\"frame\":\"Planning Review and Sign-Off\",\"name\":\"Planning Review and Sign-Off (Site → Region → Group)\",\"owner\":\"EF / Site CFO/RFD / FP&A Ops\",\"win\":\"Each planning cycle\",\"pains\":[{\"t\":\"Multiple stakeholder reviews (MIRO)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"Rework due to changes (MIRO)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"Multiple streams of information feeds create consolidation effort and waiting time (MIRO)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"Stretch timeline (MIRO)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"}],\"tpis\":[],\"opp\":[],\"steps\":[{\"n\":\"1\",\"t\":\"Site reviews including productivity (Site and RFD)\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"Site CFO/RFD\",\"sys\":\"PowerPoint site pack, Excel, Hyperion\",\"d\":\"Site reviews incl. productivity reviews with EF and RFDs (sites and central functions). Full reviews cover P&L, inventory and CAPEX using the Lean P&L; post-site-review adjustments are confirmed to GFS.\",\"pp\":[\"Multiple stakeholder reviews (MIRO)\",\"Rework due to changes (MIRO)\"]},{\"n\":\"2\",\"t\":\"Post-review adjustments uploaded and site submission completed\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"FP&A Ops\",\"sys\":\"Hyperion (Planning Hub), Excel\",\"d\":\"Post-site-review adjustments confirmed by EF are uploaded to Planning Hub and reconciled by GFS; sites' Planning Hub submission completed and site P&L submission reviewed with RFDs and completed in Hyperion; Central Functions completed for OH.\",\"pp\":[\"Rework due to changes (MIRO)\"]},{\"n\":\"3\",\"t\":\"Planning Hub soft lock and change control\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"FP&A Ops\",\"sys\":\"Hyperion (OPSPR), email\",\"d\":\"OPS Cube soft lock for P&L, then for inventory. After the soft lock any P&L change must be formally raised by email to the OPS Performance Director for approval and any MV or provision change needs the Inventory Finance Director's approval; only approved changes are adjusted in Planning Hub.\",\"pp\":[]},{\"n\":\"4\",\"t\":\"Regional packs and productivity bridges review\",\"t2\":null,\"ty\":\"hyb\",\"ty2\":\"hyb\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"FP&A Ops\",\"sys\":\"PowerPoint (regional pack), Excel, Hyperion retrieve, Teams\",\"d\":\"GFS prepares regional packs and bridges, capex spend is shared with RFDs, then the regional / central function final bridge; RFD rehearsals with pre-reads 48 hours before the meeting; the Business Review Meetings with the Ops Finance VP conclude the planning cycle and the final submission is approved after the Finance BRM.\",\"pp\":[\"Multiple streams of information feeds create consolidation effort and waiting time (MIRO)\",\"Stretch timeline (MIRO)\"]},{\"n\":\"5\",\"t\":\"Global consolidation, OPS Cube close and Group submission\",\"t2\":null,\"ty\":\"hyb\",\"ty2\":\"hyb\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"Global Ops\",\"sys\":\"Hyperion (OPSPR), Group consolidation\",\"d\":\"Global consolidation; OPS Cube (OPSPR) closes; Group submission deadline for sites, then central functions; CAPEX CY submission. Monthly reporting is against the approved planning cycle from the following month-end onwards.\",\"pp\":[]}],\"mix\":{\"man\":3,\"hyb\":2,\"auto\":0},\"mix2\":{\"man\":2,\"hyb\":3,\"auto\":0},\"n\":5,\"nCop\":0},\"G11\":{\"id\":\"G11\",\"tower\":\"FPAO\",\"fid\":\"FPAO-05\",\"frame\":\"Month-End Actualization\",\"name\":\"Month-End Close: Pre-close, Journals & SAP Close\",\"owner\":\"FP&A Ops / EF\",\"win\":\"Intra-month to WD+4 (monthly)\",\"pains\":[{\"t\":\"Data quality issues: missing data, inaccurate data (MIRO)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"The ESM COGM deployment still has gaps in end-to-end process ownership and system automation, resulting in manual monitoring and journal reclassifications during MEC, while SCC data visibility remains unresolved (LT feedback Oct 2026)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"Manual minor Capex accruals have been required since Coupa go-live; previously ASIASAP recognised Capex upon goods receipt (GR) for Capex POs raised in SAP (LT feedback Oct 2026)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"PO text not available from Coupa Accruals JE posting in SAP (upstream from R2R), which creates a challenge for variance analysis (LT feedback Oct 2026)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"Reclassification of capex-related costs from P&L to balance sheet depends on manual intervention because of a system posting limitation (AUDIT)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"Multiple systems create reconciliation complexity (SAP → SOAR → FDH → ASO), with a recurring issue where the P&L & CAPEX is unreconciled between SAP/SOAR and ASO due to missing documents and FDH report calculation logic not working properly (LT feedback Oct 2026)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"SAP → SOAR → FDH → ASO dependency: SOAR loads every 2 hours and ASO refreshes take about 4 hours (SOP)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"System issues: missing data and inaccurate (MIRO)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"},{\"t\":\"Late posting from upstream (MIRO)\",\"src\":\"FP&A Ops As-Is tab · D2P_All_Towers_Process_Maps_Oct19 (4) · Process Register (reconciled 3 Nov 2026)\"}],\"tpis\":[],\"opp\":[],\"steps\":[{\"n\":\"1\",\"t\":\"Pre-Month-End Checks\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"FP&A Ops\",\"sys\":\"SOAR / BW (MAP PPV, MAP POV, VOP / COP reports), SAP, Excel check file\",\"d\":\"COIN requirements check (VOP, COP) and weekly intra-month checks on PPV, POV and volume using the MAP PPV & RoX and MAP POV Excel reports (SKU level, brand and profit centre), with items over the site threshold investigated; SOAR VOP and COP reports exported to the 'Month End SOAR Checks' file to test plant / material compliance, brand vs Compass, FMC set-up, Brand 9999 allocation and blank profit centres, with corrections in SAP before close; new cost centres and GLs validated against the Ops P&L mapping.\",\"pp\":[\"Data quality issues: missing data, inaccurate data (MIRO)\"]},{\"n\":\"2\",\"t\":\"Month-End Journal Posting & Process Order Settlement\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"FP&A Ops\",\"sys\":\"SAP (JV, T-codes), Excel\",\"d\":\"GFS Ops prepares judgemental manual journals (stock provision, bonus accruals, operations cost accruals, capital spend and depreciation reclass, facility, distribution, freight and customs, VAT, property tax, subsidy, utilities, adjustments and reversals) and VoP / CoP correction journals, posted to SAP before close; SAP T-codes are test-run and executed for the actual close (process order settlement) with MM close coordination; sub-module close and D&A runs come from R2R and CAPEX; EF provides the provisioning input from the pre-month-end call.\",\"pp\":[\"The ESM COGM deployment still has gaps in end-to-end process ownership and system automation, resulting in manual monitoring and journal reclassifications during MEC, while SCC data visibility remains unresolved (LT feedback Oct 2026)\",\"Manual minor Capex accruals have been required since Coupa go-live; previously ASIASAP recognised Capex upon goods receipt (GR) for Capex POs raised in SAP (LT feedback Oct 2026)\",\"PO text not available from Coupa Accruals JE posting in SAP (upstream from R2R), which creates a challenge for variance analysis (LT feedback Oct 2026)\",\"Reclassification of capex-related costs from P&L to balance sheet depends on manual intervention because of a system posting limitation (AUDIT)\"]},{\"n\":\"3\",\"t\":\"Preliminary P&L preparation and reconciliation\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"FP&A Ops\",\"sys\":\"Excel (PL Review_Master_File.xlsm), SOAR / BW, SAP GD13, OBIEE Smart View, FDH, Box\",\"d\":\"The P&L Review file combines six BW retrieves (VOP, VOP non-handover, COP, PRWM, inventory, process order), two SAP GD13 downloads and an OBIEE ASO Smart View retrieve; the Rec tab reconciles VOP and COP between SOAR and GD13 and the FDH section pulls IC cut-out values (reconciled draft P&L EOD WD+1). MAP PPV & RoX and MAP POV reports are analysed against the site threshold and the Other CoGS report checked so STAT-only postings are excluded and management postings reclassified.\",\"pp\":[\"Multiple systems create reconciliation complexity (SAP → SOAR → FDH → ASO), with a recurring issue where the P&L & CAPEX is unreconciled between SAP/SOAR and ASO due to missing documents and FDH report calculation logic not working properly (LT feedback Oct 2026)\",\"SAP → SOAR → FDH → ASO dependency: SOAR loads every 2 hours and ASO refreshes take about 4 hours (SOP)\",\"System issues: missing data and inaccurate (MIRO)\"]},{\"n\":\"4\",\"t\":\"Final P&L reconciled SAP → SOAR → FDH → ASO; late postings managed\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"FP&A Ops\",\"sys\":\"SAP, SOAR, FDH, ASO / OBIEE, Excel reconciliation template, Nintex, Coupa\",\"d\":\"Final P&L is reconciled from SAP to ASO using the P&L reconciliation template; any late postings are communicated with the GL Close team; recharges (NTI and COBOU) are processed; capex spending (opex-to-capex reclass, NTI recharge, GR / IR from Coupa PO, VoWD accruals) is monitored.\",\"pp\":[\"Late posting from upstream (MIRO)\",\"Multiple systems create reconciliation complexity (SAP → SOAR → FDH → ASO), with a recurring issue where the P&L & CAPEX is unreconciled between SAP/SOAR and ASO due to missing documents and FDH report calculation logic not working properly (LT feedback Oct 2026)\",\"SAP → SOAR → FDH → ASO dependency: SOAR loads every 2 hours and ASO refreshes take about 4 hours (SOP)\",\"System issues: missing data and inaccurate (MIRO)\"]},{\"n\":\"5\",\"t\":\"P&L review with EF and site CFO; SAP sign-off\",\"t2\":null,\"ty\":\"man\",\"ty2\":\"man\",\"ch\":\"same\",\"rec\":null,\"tools\":null,\"feas\":null,\"cop\":null,\"o\":\"EF\",\"sys\":\"OBIEE (OPS014117 Monthly / YTD Ops P&L), SAP, Teams\",\"d\":\"Draft commentary is prepared in the MI Pack, MVs and deferral calculated, and the P&L reviewed with Embedded Finance and the site CFO / Head of Finance before SAP close; the P&L results incl. material variance assessment are signed off by EF, the balance sheet is reviewed and signed off and controls attestation completed.\",\"pp\":[]}],\"mix\":{\"man\":5,\"hyb\":0,\"auto\":0},\"mix2\":{\"man\":2,\"hyb\":1,\"aut L=M.nodes.map(nodeHTML).join(\"\");\n/* ============ EDGES ============ */\nconst E=M.edges;\nconst resolveOwner=id=>{const n=byId[id];if(n.owner)return n.owner;const prev=E.find(e=>e.b===id&&!e.kind);return prev?resolveOwner(prev.a):\"\"};\nconst resolveTower=id=>{const n=byId[id];if(n.tower)return n.tower;const prev=E.find(e=>e.b===id&&!e.kind);return prev?resolveTower(prev.a):null};\nconst HO=new Set();E.forEach((e,i)=>{if(e.kind)return;const a=resolveOwner(e.a),b=resolveOwner(e.b);if(a&&b&&a!==b&&byId[e.b].kind!==\"end\"&&(byId[e.b].kind!==\"dec\"||E.findIndex(x=>x.b===e.b&&!x.kind)!==i))HO.add(i)});\nfunction pts(e){const A=byId[e.a],B=byId[e.b],k=e.kind||\"\";const P=[];\n  const aR={x:A.x+A.w,y:A.cy},aT={x:A.cx,y:A.y},aB={x:A.cx,y:A.y+A.h},bL={x:B.x,y:B.cy},bT={x:B.cx,y:B.y},bB={x:B.cx,y:B.y+B.h};\n  if(k===\"loop\"||k===\"cyc\"){const up=k===\"loop\"&&!(A.row===1&&B.row===1)?(A.row===0?true:A.row===1):false;const span=Math.abs(A.col-B.col);const extra=k===\"loop\"&&span>2?30:0;\n    const chY=k===\"cyc\"?HZ-12:(up?A.cy-RP/2-extra+30:A.cy+RP/2+extra-30);P.push(up?aT:aB,{x:A.cx,y:chY},{x:B.cx,y:chY},chY<B.cy?bT:bB);return P}\n  if(A.col===B.col){P.push(A.row<B.row?aB:aT,A.row<B.row?bT:bB);return P}\n  if(A.row===B.row){P.push(aR,bL);return P}\n  if(A.kind===\"dec\"){P.push(A.row<B.row?aB:aT,{x:A.cx,y:B.cy},bL);return P}\n  P.push(aR,{x:B.cx,y:A.cy},A.row<B.row?bT:bB);return P}\nconst EP=[];\nfunction drawEdges(){const ov=document.getElementById(\"ov\");let h=\"\",lab=\"\";E.forEach((e,i)=>{const P=pts(e);const k=e.kind||\"\";const ho=HO.has(i);e.P=P;e.ho=ho;\n  const d=P.map((p,j)=>(j?\"L\":\"M\")+p.x.toFixed(1)+\",\"+p.y.toFixed(1)).join(\" \");\n  h+=`${k?\"\":`<path class=\"eg\" d=\"${d}\"/>`}<path class=\"e ${k} ${ho?\"ho\":\"\"}\" id=\"e-${i}\" d=\"${d}\" marker-end=\"url(#${k===\"loop\"?\"ml\":k===\"cyc\"?\"mc\":\"m\"})\"/>`;\n  if(e.lab&&k!==\"cyc\"){const p0=P[0],p1=P[1];const dx=Math.sign(p1.x-p0.x),dy=Math.sign(p1.y-p0.y);const lx=p0.x+dx*26,ly=p0.y+
